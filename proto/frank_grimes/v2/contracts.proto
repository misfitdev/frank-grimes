// The sole normative machine contract for Frank Grimes.
//
// skills/frank-grimes/SKILL.md remains the sole normative methodology and
// references these message and enum names without restating their fields.
// Generated bindings, TextProto fixtures, and JSON projections are
// non-normative consumers.
syntax = "proto3";

package frank_grimes.v2;

import "buf/validate/validate.proto";
import "google/protobuf/timestamp.proto";

// ---------------------------------------------------------------------------
// Shared types
// ---------------------------------------------------------------------------

enum Category {
  CATEGORY_UNSPECIFIED = 0;
  CATEGORY_COR = 1;
  CATEGORY_INT = 2;
  CATEGORY_SEC = 3;
  CATEGORY_REL = 4;
  CATEGORY_OPS = 5;
  CATEGORY_PER = 6;
  CATEGORY_VER = 7;
  CATEGORY_MNT = 8;
  CATEGORY_DEP = 9;
  CATEGORY_HUM = 10;
}

enum Severity {
  SEVERITY_UNSPECIFIED = 0;
  SEVERITY_P0 = 1;
  SEVERITY_P1 = 2;
  SEVERITY_P2 = 3;
  SEVERITY_P3 = 4;
}

enum Likelihood {
  LIKELIHOOD_UNSPECIFIED = 0;
  LIKELIHOOD_LIKELY = 1;
  LIKELIHOOD_PLAUSIBLE = 2;
  LIKELIHOOD_UNLIKELY = 3;
  LIKELIHOOD_UNKNOWN = 4;
}

enum BlastRadius {
  BLAST_RADIUS_UNSPECIFIED = 0;
  BLAST_RADIUS_SINGLE_USER = 1;
  BLAST_RADIUS_LOCAL_COMPONENT = 2;
  BLAST_RADIUS_SERVICE = 3;
  BLAST_RADIUS_SYSTEMIC = 4;
}

enum FindingStatus {
  FINDING_STATUS_UNSPECIFIED = 0;
  FINDING_STATUS_OPEN = 1;
  FINDING_STATUS_FIXED = 2;
  FINDING_STATUS_VERIFIED = 3;
  FINDING_STATUS_ACCEPTED = 4;
  FINDING_STATUS_FALSE_POSITIVE = 5;
  FINDING_STATUS_REGRESSED = 6;
  // Replaced by a finding that restates the same defect at the same place. The
  // record stays so the successor has something to point at.
  FINDING_STATUS_SUPERSEDED = 7;
}

enum EvidenceTier {
  EVIDENCE_TIER_UNSPECIFIED = 0;
  EVIDENCE_TIER_E1 = 1;
  EVIDENCE_TIER_E2 = 2;
  EVIDENCE_TIER_E3 = 3;
}

// What kind of artifact is under review. The kind selects the collector and
// the record each evidence tier requires; it never changes the verdict rules.
enum TargetKind {
  TARGET_KIND_UNSPECIFIED = 0;
  TARGET_KIND_CODE = 1;
  TARGET_KIND_DOCUMENT = 2;
  TARGET_KIND_IDEA = 3;
  TARGET_KIND_EXTERNAL = 4;
}

message Target {
  // A pasted argument has no repository to be rooted in, so root is required
  // only where one exists.
  option (buf.validate.message).cel = {
    id: "target.code_requires_root"
    message: "a code target must record the repository root it was taken from"
    expression: "this.kind != 1 || this.root != ''"
  };

  string root = 1;
  string scope = 2 [(buf.validate.field).string.min_len = 1];
  bytes fingerprint_sha256 = 3 [(buf.validate.field).bytes.len = 32];
  string display = 4 [(buf.validate.field).string.max_len = 512];
  TargetKind kind = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// One reviewable unit of the target, in whatever unit the target is made of: a
// file for code, a section for a document, a numbered step for an argument, a
// source for an external artifact.
message TargetUnit {
  // Stable within one inventory, so coverage can name what it examined: a
  // repository-relative path, a section slug, a step number, a URI.
  string id = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
  string label = 2 [(buf.validate.field).string.max_len = 512];
}

// What collection resolved. The unit list is the denominator coverage is later
// counted against, so it is fixed before the target is attacked.
message TargetInventory {
  uint32 schema_major = 1 [(buf.validate.field).uint32.const = 2];
  // An inventory belongs to the target it was taken from; one carried to a
  // different target would count the wrong units.
  bytes target_fingerprint_sha256 = 2 [(buf.validate.field).bytes.len = 32];
  repeated TargetUnit units = 3 [(buf.validate.field).repeated.min_items = 1];
}

// A repository-relative path that cannot escape the repository root.
message RepoPath {
  option (buf.validate.message).cel = {
    id: "repo_path.relative_and_contained"
    message: "path must be repository-relative and cannot escape with .."
    expression:
      "!this.value.startsWith('/') && this.value != '..' && "
      "!this.value.startsWith('../') && !this.value.contains('/../') && "
      "!this.value.endsWith('/..')"
  };

  string value = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
  }];
}

// A place in a code target.
message RepoLine {
  RepoPath path = 1 [(buf.validate.field).required = true];
  optional uint32 line = 2 [(buf.validate.field).uint32.gt = 0];
  optional string symbol = 3 [(buf.validate.field).string.max_len = 512];
}

// A place in a supplied document. The section identifier is the document's own
// ("4.2", "Appendix B", a heading), not an offset, so reformatting does not
// move it.
message DocumentPart {
  string document = 1 [(buf.validate.field).string.min_len = 1];
  string section = 2 [(buf.validate.field).string = {
    min_len: 1
    max_len: 512
  }];
  optional string heading = 3 [(buf.validate.field).string.max_len = 512];
}

// A numbered claim or inference step in a supplied argument.
message ArgumentStep {
  string argument = 1 [(buf.validate.field).string.min_len = 1];
  uint32 step = 2 [(buf.validate.field).uint32.gt = 0];
  optional string label = 3 [(buf.validate.field).string.max_len = 512];
}

// An external source. The digest and timestamp are what make a retrieved page
// citable later: without them the quote cannot be checked against what was
// actually read.
message RetrievedSource {
  string uri = 1 [(buf.validate.field).string = {
    min_len: 1
    max_len: 4096
    uri: true
  }];
  string publisher = 2 [(buf.validate.field).string.min_len = 1];
  optional string section = 3 [(buf.validate.field).string.max_len = 512];
  bytes snapshot_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  google.protobuf.Timestamp retrieved_at = 5 [(buf.validate.field).required = true];
}

// Where a finding or a quotation lives. One locator for every target kind, so
// a review of a proposal anchors its findings as precisely as a review of a
// diff does.
message Anchor {
  oneof at {
    option (buf.validate.oneof).required = true;
    RepoLine repo_line = 1;
    DocumentPart document_part = 2;
    ArgumentStep argument_step = 3;
    RetrievedSource retrieved_source = 4;
  }
}

message Location {
  reserved 1, 2;
  reserved "path", "symbol";

  Anchor anchor = 3 [(buf.validate.field).required = true];
}

message Risk {
  Severity severity = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Likelihood likelihood = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  BlastRadius blast_radius = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// Accepting a risk is a human decision with a name attached and a date by
// which it is revisited. An accepted finding with no owner is an orphaned risk.
message HumanOwner {
  string id = 1 [(buf.validate.field).string.min_len = 1];
  string rationale = 2 [(buf.validate.field).string.min_len = 1];
  google.protobuf.Timestamp recorded_at = 3 [(buf.validate.field).required = true];
  google.protobuf.Timestamp review_by = 4 [(buf.validate.field).required = true];
}

// ---------------------------------------------------------------------------
// Evidence
// ---------------------------------------------------------------------------

// A command that was run, with what it did.
message ExecutedCommand {
  string action = 1 [(buf.validate.field).string.min_len = 1];
  RepoPath cwd = 2 [(buf.validate.field).required = true];
  int32 exit_code = 3;
  oneof output {
    option (buf.validate.oneof).required = true;
    string output_excerpt = 4 [(buf.validate.field).string.min_len = 1];
    bytes output_sha256 = 5 [(buf.validate.field).bytes.len = 32];
  }
}

// A case that the target's own claim does not survive. The claim is quoted so
// the violation can be checked against what was actually asserted, rather than
// against a paraphrase of it.
message Counterexample {
  Anchor claim_anchor = 1 [(buf.validate.field).required = true];
  string claim_quote = 2 [(buf.validate.field).string.min_len = 1];
  string counterexample = 3 [(buf.validate.field).string.min_len = 1];
  string violation = 4 [(buf.validate.field).string.min_len = 1];
}

// What was exhibited, and when. An executed command is one way to exhibit a
// defect; a counterexample the target's claim cannot survive is another.
message Reproduction {
  reserved 1 to 5;
  reserved "action", "cwd", "exit_code", "output_excerpt", "output_sha256";

  google.protobuf.Timestamp completed_at = 6 [(buf.validate.field).required = true];
  oneof exhibit {
    option (buf.validate.oneof).required = true;
    ExecutedCommand executed_command = 7;
    Counterexample counterexample = 8;
  }
}

message Citation {
  reserved 1, 2;
  reserved "path", "line";

  string quote = 3 [(buf.validate.field).string.min_len = 1];
  Anchor anchor = 4 [(buf.validate.field).required = true];
}

// What was done to disprove a finding, and what came of it.
//
// Every candidate is supposed to survive an attempt on its own life. Recording
// the attempt is what separates a finding that was attacked and held from one
// nobody tried, which otherwise read the same.
//
// An attempt that could not be made carries its reason instead. That caps the
// verdict rather than acquitting the finding, which is the treatment the skill
// already gives an unattemptable falsifier.
message DisproofAttempt {
  // Only a probe that ran can have come back against anything. The CLI never
  // pairs the two, but a provider writes its own report: the flag would reach
  // the verdict as an evidence conflict raised by an attempt nobody made.
  option (buf.validate.message).cel = {
    id: "disproof.contradiction_needs_an_attempt"
    message: "a disproof that was not performed cannot contradict the claim"
    expression: "!this.contradicts_claim || has(this.performed)"
  };

  oneof outcome {
    option (buf.validate.oneof).required = true;
    Reproduction performed = 1;
    string unavailable = 2 [(buf.validate.field).string.min_len = 1];
  }
  // Set when the attempt came back against the finding: the probe ran and said
  // the accusation is wrong. Reported anyway, the two records disagree, and a
  // verdict resting on the pair cannot be confident.
  bool contradicts_claim = 3;
}

message Inference {
  string assumption = 1 [(buf.validate.field).string.min_len = 1];
  string reasoning = 2 [(buf.validate.field).string.min_len = 1];
  string falsifier = 3 [(buf.validate.field).string.min_len = 1];
}

// The oneof prevents a tier being claimed without the record that tier
// requires, which is how a command name gets promoted to reproduced evidence.
message Evidence {
  option (buf.validate.message).cel = {
    id: "evidence.tier_matches_detail"
    message: "evidence tier must match its detail branch"
    expression:
      "(this.tier == 1 && has(this.reproduction)) || "
      "(this.tier == 2 && has(this.citation)) || "
      "(this.tier == 3 && has(this.inference))"
  };

  EvidenceTier tier = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string claim = 2 [(buf.validate.field).string.min_len = 1];
  oneof detail {
    option (buf.validate.oneof).required = true;
    Reproduction reproduction = 3;
    Citation citation = 4;
    Inference inference = 5;
  }
  // Absent means nobody tried. That is a coverage limit rather than a lie, so
  // it is expressible; it simply earns nothing.
  DisproofAttempt disproof = 6;
}

// ---------------------------------------------------------------------------
// What a provider may say
// ---------------------------------------------------------------------------

// A finding as a provider may report it.
//
// Identity, timestamps, and lifecycle history are absent because they are the
// ledger's to assign: a provider that could state an ID could rename a finding
// to escape its own history.
message CandidateFinding {
  // The tier caps constrain the pairing of a severity with the evidence offered
  // for it, so they apply wherever that pairing appears. The expressions are
  // identical to Finding's by construction; scripts/validate.sh fails the build
  // if the two copies drift.
  option (buf.validate.message).cel = {
    id: "candidate.p0_requires_e1_or_e2"
    message: "P0 requires E1 or E2 evidence"
    expression: "this.risk.severity != 1 || this.evidence.tier in [1, 2]"
  };
  option (buf.validate.message).cel = {
    id: "candidate.e3_caps_at_p1"
    message: "inferred evidence cannot support a severity above P1"
    expression: "this.evidence.tier != 3 || this.risk.severity != 1"
  };

  Category category = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Location location = 2 [(buf.validate.field).required = true];
  Risk risk = 3 [(buf.validate.field).required = true];
  Evidence evidence = 4 [(buf.validate.field).required = true];
  optional string suggested_fix = 5 [(buf.validate.field).string.max_len = 4096];
}

// What ended a category's grind.
//
// Recorded per routed category, because "every probe came back none" and "no
// probe was possible" are different facts about a review and only one of them
// is a stop the reviewer earned.
enum StopCondition {
  STOP_CONDITION_UNSPECIFIED = 0;
  STOP_CONDITION_MARGINAL_YIELD = 1;
  STOP_CONDITION_PROBES_EXHAUSTED = 2;
  STOP_CONDITION_EVIDENCE_UNAVAILABLE = 3;
}

message CategoryStop {
  Category category = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  StopCondition condition = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 probes_attempted = 3;
}

// What was done to show the probe could have failed, and what happened when it
// was done. A probe that cannot fail distinguishes nothing, so its passing says
// nothing about the target.
//
// Whether the probe failed is not recorded, because a provider that could state
// it would be writing down the outcome it wanted. It is read from the result:
// a command that exited non-zero, or a counterexample the mutated target could
// not survive.
message NegativeControl {
  // A control whose command succeeded is a probe that did not notice the defect
  // it was pointed at. That is a broken probe rather than a result to record
  // with a caveat, so there is no way to write it down.
  option (buf.validate.message).cel = {
    id: "control.probe_must_have_failed"
    message: "a probe that passed against the mutated target has not been shown capable of failing"
    expression:
      "!has(this.result.executed_command) || "
      "this.result.executed_command.exit_code != 0"
  };

  string mutation = 1 [(buf.validate.field).string.min_len = 1];
  Reproduction result = 2 [(buf.validate.field).required = true];
  reserved 3;
  reserved "probe_failed";
}

// A claim this review attacked and could not break.
//
// An acquittal without a control is still a record of what was done. It earns
// nothing, the way an unattemptable falsifier earns nothing.
message Acquittal {
  Category category = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Anchor claim_anchor = 2 [(buf.validate.field).required = true];
  string claim = 3 [(buf.validate.field).string.min_len = 1];
  Reproduction probe = 4 [(buf.validate.field).required = true];
  NegativeControl control = 5;
  string scope = 6 [(buf.validate.field).string.min_len = 1];
}

// A unit deliberately not examined. The reason is required: an unexplained
// skip is indistinguishable from an oversight.
message SkippedUnit {
  string unit_id = 1 [(buf.validate.field).string.min_len = 1];
  string reason = 2 [(buf.validate.field).string.min_len = 1];
  bool material = 3;
}

// Which units of the target were looked at, and which deliberately were not.
// The denominator lives in TargetInventory, which the engine owns; this is the
// provider accounting for itself against it.
message UnitCoverage {
  repeated string examined = 1 [(buf.validate.field).repeated.unique = true];
  repeated SkippedUnit skipped = 2;
}

// What a primary review hands back.
//
// There is no verdict here, and no colour, counts, or completion state. The
// engine derives all of them, and a message able to carry them would be a
// message a provider could use to decide its own review.
//
// Nor is there a marginal-yield count: that decides when the loop stops, so it
// is derived from what the ledger did and did not already hold.
message ProviderReport {
  // A category routed but never stopped is a grind that was abandoned rather
  // than finished, and the record has to be able to tell the difference.
  option (buf.validate.message).cel = {
    id: "report.every_routed_category_stopped"
    message: "every routed category must record what ended its grind"
    expression:
      "this.routed_categories.all(c, "
      "this.category_stops.exists(s, s.category == c))"
  };
  // A stop for a category that was never routed is a probe count the report
  // was not asked for, and it would otherwise satisfy the engine's "was
  // anything probed" test on behalf of a category nobody reviewed.
  option (buf.validate.message).cel = {
    id: "report.stops_confined_to_routed_categories"
    message: "a category stop must name a routed category"
    expression:
      "this.category_stops.all(s, "
      "s.category in this.routed_categories)"
  };
  // One stop per category. Two stops for the same category are two accounts of
  // how its grind ended, and nothing here can say which one happened.
  option (buf.validate.message).cel = {
    id: "report.one_stop_per_category"
    message: "a category must not record more than one stop"
    expression:
      "this.category_stops.all(s, "
      "this.category_stops.filter(o, o.category == s.category).size() == 1)"
  };
  // An acquittal anchored in some other kind of artifact cannot be resolved
  // against the target it claims to acquit. Same rule the ledger applies to a
  // finding's anchor, for the same reason.
  option (buf.validate.message).cel = {
    id: "report.acquittal_anchor_matches_target"
    message: "each acquittal must be anchored in the kind of target under review"
    expression:
      "this.acquittals.all(a, "
      "this.target.kind == 1 ? has(a.claim_anchor.repo_line) : "
      "this.target.kind == 2 ? has(a.claim_anchor.document_part) : "
      "this.target.kind == 3 ? has(a.claim_anchor.argument_step) : "
      "has(a.claim_anchor.retrieved_source))"
  };
  // A unit cannot be both looked at and deliberately not looked at. The
  // engine checks the union against the inventory; only overlap is visible
  // from inside the report.
  option (buf.validate.message).cel = {
    id: "report.coverage_sets_are_disjoint"
    message: "a unit cannot be both examined and skipped"
    expression:
      "this.coverage.skipped.all(s, "
      "!(s.unit_id in this.coverage.examined))"
  };
  uint32 schema_major = 1 [(buf.validate.field).uint32.const = 2];
  uint32 schema_minor = 2;
  string run_id = 3 [(buf.validate.field).string.min_len = 1];
  Target target = 4 [(buf.validate.field).required = true];
  Mode mode = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 iteration = 6 [(buf.validate.field).uint32.gt = 0];
  repeated CandidateFinding candidates = 7;
  repeated Category routed_categories = 8 [(buf.validate.field).repeated = {
    unique: true
    items: {
      enum: {
        defined_only: true
        not_in: [0]
      }
    }
  }];
  uint32 candidates_examined = 9;
  uint32 candidates_disproved = 10;
  string summary = 11 [(buf.validate.field).string.min_len = 1];
  UnitCoverage coverage = 12;
  repeated CategoryStop category_stops = 13;
  repeated Acquittal acquittals = 14;
}

// What an independent review hands back: a verdict tuple over a named target,
// and nothing else. An adjudicator that could report findings would be
// reviewing rather than adjudicating.
message AdjudicationReport {
  uint32 schema_major = 1 [(buf.validate.field).uint32.const = 2];
  uint32 schema_minor = 2;
  string run_id = 3 [(buf.validate.field).string.min_len = 1];
  string reviewer_id = 4 [(buf.validate.field).string.min_len = 1];
  bytes target_fingerprint_sha256 = 5 [(buf.validate.field).bytes.len = 32];
  Verdict verdict = 6 [(buf.validate.field).required = true];
  google.protobuf.Timestamp completed_at = 7 [(buf.validate.field).required = true];
}

// One claim put to a context that did not form it.
//
// The claim, its anchor, and the artifact are the whole of what a refuter is
// given. Severity, reporter, and the evidence narrative are withheld: each is
// part of the case for the claim, and a reviewer shown the case examines the
// case rather than the claim.
//
// The ref is opaque so that the handle itself carries none of what the fields
// withhold. The engine issues it and maps it back.
message ClaimUnderTest {
  string ref = 1 [(buf.validate.field).string.min_len = 1];
  Category category = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Anchor anchor = 3 [(buf.validate.field).required = true];
  string claim = 4 [(buf.validate.field).string.min_len = 1];
}

// What a refuter is handed: the claims, and the target they are about.
message RefutationTask {
  uint32 schema_major = 1 [(buf.validate.field).uint32.const = 2];
  uint32 schema_minor = 2;
  string run_id = 3 [(buf.validate.field).string.min_len = 1];
  Target target = 4 [(buf.validate.field).required = true];
  uint32 iteration = 5 [(buf.validate.field).uint32.gt = 0];
  repeated ClaimUnderTest claims = 6;
}

// What came of one attempt on one claim.
//
// An upheld claim carries the attack that failed to break it, for the same
// reason a disproof records what was performed: an attempt nobody made and an
// attempt that came back empty read identically once only the conclusion is
// kept.
message ClaimOutcome {
  string ref = 1 [(buf.validate.field).string.min_len = 1];
  oneof outcome {
    option (buf.validate.oneof).required = true;
    Reproduction refuted = 2;
    Reproduction upheld = 3;
    string unavailable = 4 [(buf.validate.field).string.min_len = 1];
  }
}

// What a refutation pass hands back: one outcome per claim it was given.
//
// There is no finding here and no verdict. A refuter that could report either
// would be reviewing, and its report would be the first review rather than an
// attack on one.
message RefutationReport {
  // Two answers for one claim let the order of the report decide what the
  // engine records, which a refuter could use to both break the control and
  // vouch for it.
  option (buf.validate.message).cel = {
    id: "refutation.one_outcome_per_claim"
    message: "a report answers each claim once"
    expression: "this.outcomes.all(o, this.outcomes.filter(x, x.ref == o.ref).size() == 1)"
  };

  uint32 schema_major = 1 [(buf.validate.field).uint32.const = 2];
  uint32 schema_minor = 2;
  string run_id = 3 [(buf.validate.field).string.min_len = 1];
  string refuter_id = 4 [(buf.validate.field).string.min_len = 1];
  bytes target_fingerprint_sha256 = 5 [(buf.validate.field).bytes.len = 32];
  repeated ClaimOutcome outcomes = 6;
  google.protobuf.Timestamp completed_at = 7 [(buf.validate.field).required = true];
}

// One recorded attempt on a finding by a context that did not raise it.
//
// The context origin is kept alongside the outcome because an attack from a
// context that may have formed the claim is the claim agreeing with itself.
message RefutationAttempt {
  string refuter_id = 1 [(buf.validate.field).string.min_len = 1];
  ContextOrigin context_origin = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  oneof outcome {
    option (buf.validate.oneof).required = true;
    Reproduction refuted = 3;
    Reproduction upheld = 4;
    string unavailable = 5 [(buf.validate.field).string.min_len = 1];
  }
  google.protobuf.Timestamp completed_at = 6 [(buf.validate.field).required = true];
}

// How much a finding's standing was earned rather than asserted.
//
// Ordered strongest first, like every other graded enum here. UNATTACKED is
// where a finding nobody put to an independent attack sits: not discredited,
// but holding nothing more than the word of the context that raised it.
enum FindingProvenance {
  FINDING_PROVENANCE_UNSPECIFIED = 0;
  FINDING_PROVENANCE_UPHELD = 1;
  FINDING_PROVENANCE_UNATTACKED = 2;
  FINDING_PROVENANCE_REFUTED = 3;
}

// Whether the refutation pass was shown capable of refuting, by being handed a
// claim the engine had already established to be false about this target.
//
// UNSPECIFIED is no pass having run. INCONCLUSIVE covers a refuter that neither
// broke the control nor vouched for it: it reported the control unavailable, or
// did not answer on it at all.
enum RefuterCheck {
  REFUTER_CHECK_UNSPECIFIED = 0;
  REFUTER_CHECK_PASSED = 1;
  REFUTER_CHECK_FAILED = 2;
  REFUTER_CHECK_INCONCLUSIVE = 3;
}

// ---------------------------------------------------------------------------
// Findings and the ledger
// ---------------------------------------------------------------------------

message FindingEvent {
  // A move to verified is the one transition a context cannot assert: it is a
  // claim about a gate, so the gate's own output digest is what carries it.
  option (buf.validate.message).cel = {
    id: "finding_event.verified_carries_its_gate"
    message: "a move to verified must carry the digest of the gate that passed"
    expression: "this.to != 3 || size(this.verified_by_sha256) == 32"
  };
  option (buf.validate.message).cel = {
    id: "finding_event.only_verified_carries_a_gate"
    message: "only a move to verified carries a gate digest"
    expression: "this.to == 3 || size(this.verified_by_sha256) == 0"
  };

  uint32 iteration = 1 [(buf.validate.field).uint32.gt = 0];
  FindingStatus from = 2 [(buf.validate.field).enum.defined_only = true];
  FindingStatus to = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bytes evidence_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  google.protobuf.Timestamp at = 5 [(buf.validate.field).required = true];
  string actor = 6 [(buf.validate.field).string.min_len = 1];
  // The output digest of the verification that passed over this finding's fix.
  bytes verified_by_sha256 = 7 [
    (buf.validate.field).bytes.len = 32,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message Finding {
  option (buf.validate.message).cel = {
    id: "finding.accepted_requires_human_owner"
    message: "accepted findings require a human owner"
    expression: "this.status != 4 || has(this.owner)"
  };
  option (buf.validate.message).cel = {
    id: "finding.p0_requires_e1_or_e2"
    message: "P0 requires E1 or E2 evidence"
    expression: "this.risk.severity != 1 || this.evidence.tier in [1, 2]"
  };
  option (buf.validate.message).cel = {
    id: "finding.e3_caps_at_p1"
    message: "inferred evidence cannot support a severity above P1"
    expression: "this.evidence.tier != 3 || this.risk.severity != 1"
  };

  string id = 1 [(buf.validate.field).string.pattern = "^FG-(COR|INT|SEC|REL|OPS|PER|VER|MNT|DEP|HUM)-[0-9a-f]{12}([0-9a-f]{4})?$"];
  bytes fingerprint_sha256 = 2 [(buf.validate.field).bytes.len = 32];
  Category category = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Location location = 4 [(buf.validate.field).required = true];
  Risk risk = 5 [(buf.validate.field).required = true];
  Evidence evidence = 6 [(buf.validate.field).required = true];
  bytes evidence_sha256 = 7 [(buf.validate.field).bytes.len = 32];
  FindingStatus status = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  HumanOwner owner = 9;
  google.protobuf.Timestamp first_seen = 10 [(buf.validate.field).required = true];
  google.protobuf.Timestamp last_seen = 11 [(buf.validate.field).required = true];
  repeated FindingEvent history = 12 [(buf.validate.field).repeated.min_items = 1];
  // Written by the engine from refutation passes, never by the context that
  // raised the finding.
  repeated RefutationAttempt refutation = 13;
  // The finding this one replaces, when it restates a defect the ledger already
  // held at this anchor under a different wording. Derived by the engine: a
  // context that could choose it could merge two defects into one, or split one
  // into two, and the loop reads both as progress.
  string supersedes = 14 [
    (buf.validate.field).string.pattern = "^FG-(COR|INT|SEC|REL|OPS|PER|VER|MNT|DEP|HUM)-[0-9a-f]{12}([0-9a-f]{4})?$",
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
}

message Ledger {
  // A finding lives in the target under review. A code ledger holding a
  // document_part is a finding about something else, and coverage counted
  // against this target's inventory would never account for it.
  //
  // Only Finding.location.anchor is constrained. Evidence.citation.anchor is
  // deliberately free: a finding in code may cite the spec it contradicts.
  option (buf.validate.message).cel = {
    id: "ledger.anchor_kind_matches_target"
    message: "each finding must be anchored in the kind of target under review"
    expression:
      "this.findings.all(k, "
      "this.target.kind == 1 ? has(this.findings[k].location.anchor.repo_line) : "
      "this.target.kind == 2 ? has(this.findings[k].location.anchor.document_part) : "
      "this.target.kind == 3 ? has(this.findings[k].location.anchor.argument_step) : "
      "has(this.findings[k].location.anchor.retrieved_source))"
  };

  // A successor names a record that is still here and has stood aside for it.
  // Without both halves the chain is a dangling id, and the defect the
  // predecessor described is lost rather than carried forward.
  option (buf.validate.message).cel = {
    id: "ledger.supersession_is_linked"
    message: "a superseding finding must name another finding in this ledger that is marked superseded"
    expression:
      "this.findings.all(k, this.findings[k].supersedes == '' || "
      "(this.findings[k].supersedes != k && "
      "this.findings[k].supersedes in this.findings && "
      "this.findings[this.findings[k].supersedes].status == 7))"
  };

  uint32 schema_major = 1 [(buf.validate.field).uint32.const = 2];
  uint32 schema_minor = 2;
  Target target = 3 [(buf.validate.field).required = true];
  map<string, Finding> findings = 4;
  // The target this ledger's findings were raised against before a fix moved
  // it. Present only on a ledger that crossed a fingerprint change, and written
  // by the run that made the change: it is what separates a target the review
  // edited from one that moved under it.
  repeated bytes ancestor_fingerprints_sha256 = 5 [(buf.validate.field).repeated = {
    items: {
      bytes: {len: 32}
    }
  }];
}

// ---------------------------------------------------------------------------
// Verdict
// ---------------------------------------------------------------------------

enum Decision {
  DECISION_UNSPECIFIED = 0;
  DECISION_BLOCK = 1;
  DECISION_CONDITIONAL = 2;
  DECISION_PASS = 3;
  DECISION_INFORMATIONAL = 4;
}

enum ResidualRisk {
  RESIDUAL_RISK_UNSPECIFIED = 0;
  RESIDUAL_RISK_CRITICAL = 1;
  RESIDUAL_RISK_HIGH = 2;
  RESIDUAL_RISK_MODERATE = 3;
  RESIDUAL_RISK_LOW = 4;
  RESIDUAL_RISK_UNKNOWN = 5;
}

enum ReviewConfidence {
  REVIEW_CONFIDENCE_UNSPECIFIED = 0;
  REVIEW_CONFIDENCE_HIGH = 1;
  REVIEW_CONFIDENCE_MEDIUM = 2;
  REVIEW_CONFIDENCE_LOW = 3;
}

enum ReviewCompleteness {
  REVIEW_COMPLETENESS_UNSPECIFIED = 0;
  REVIEW_COMPLETENESS_SUFFICIENT = 1;
  REVIEW_COMPLETENESS_LIMITED = 2;
  REVIEW_COMPLETENESS_INCONCLUSIVE = 3;
}

enum LegacyColor {
  LEGACY_COLOR_UNSPECIFIED = 0;
  LEGACY_COLOR_GREEN = 1;
  LEGACY_COLOR_YELLOW = 2;
  LEGACY_COLOR_RED = 3;
}

message Verdict {
  Decision decision = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  ResidualRisk residual_risk = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  ReviewConfidence review_confidence = 3 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  ReviewCompleteness review_completeness = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// ---------------------------------------------------------------------------
// Result, verification, and loop state
// ---------------------------------------------------------------------------

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_REPORT = 1;
  MODE_FIX = 2;
}

enum CompletionState {
  COMPLETION_STATE_UNSPECIFIED = 0;
  COMPLETION_STATE_CONTINUE = 1;
  COMPLETION_STATE_REVIEW_COMPLETE = 2;
  COMPLETION_STATE_FIX_COMPLETE = 3;
  COMPLETION_STATE_ITERATION_LIMIT = 4;
  COMPLETION_STATE_BLOCKED = 5;
  // The loop ran out of new findings without having exhausted either coverage
  // or refutation. It stopped; it did not finish.
  COMPLETION_STATE_BOUNDED = 6;
}

enum ProducerRole {
  PRODUCER_ROLE_UNSPECIFIED = 0;
  PRODUCER_ROLE_GRINDER = 1;
  PRODUCER_ROLE_VERIFIER = 2;
  PRODUCER_ROLE_ORCHESTRATOR = 3;
}

enum VerificationStatus {
  VERIFICATION_STATUS_UNSPECIFIED = 0;
  VERIFICATION_STATUS_PASSED = 1;
  VERIFICATION_STATUS_FAILED = 2;
  VERIFICATION_STATUS_UNAVAILABLE = 3;
  VERIFICATION_STATUS_NOT_APPLICABLE = 4;
}

// Which rule in the skill's gate selection order chose the gate. "The
// repository's own check passed" and "no gate was available" are different
// facts about a review, and only this distinguishes them.
enum GateSelection {
  GATE_SELECTION_UNSPECIFIED = 0;
  GATE_SELECTION_USER_SUPPLIED = 1;
  GATE_SELECTION_REPOSITORY_CHECK = 2;
  GATE_SELECTION_DOCUMENTED_COMMAND = 3;
  GATE_SELECTION_UNAVAILABLE = 4;
}

message Verification {
  option (buf.validate.message).cel = {
    id: "verification.passed_requires_success"
    message: "passed verification requires command, zero exit, output digest, and timestamp"
    expression:
      "this.status != 1 || "
      "(this.command != '' && this.exit_code == 0 && "
      "size(this.output_sha256) == 32 && has(this.completed_at))"
  };
  // A gate that ran was selected by one of the three rules that can name a
  // command; one that did not run was selected by none of them.
  option (buf.validate.message).cel = {
    id: "verification.selection_matches_status"
    message: "a gate that ran records which rule selected it, and an unavailable one records that it was unavailable"
    expression: "(this.status == 3 || this.status == 4) == (this.selected_by == 4)"
  };

  VerificationStatus status = 1 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  string command = 2;
  RepoPath cwd = 3;
  int32 exit_code = 4;
  bytes output_sha256 = 5;
  google.protobuf.Timestamp completed_at = 6;
  // Not optional: "the repository's own check passed" and "no gate was
  // available" are different facts, and a record that omits which rule applied
  // cannot tell them apart.
  GateSelection selected_by = 7 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

// How the context that produced a review came to exist.
//
// UNKNOWN is the honest default and the common case: an opaque provider command
// may have opened a new session or reused the caller's, and nothing the engine
// can observe distinguishes them. ENGINE_SPAWNED says the engine started the
// process, was told by the operator that the command begins a fresh context,
// and left no prior-review state within reach of it.
enum ContextOrigin {
  CONTEXT_ORIGIN_UNSPECIFIED = 0;
  CONTEXT_ORIGIN_ENGINE_SPAWNED = 1;
  CONTEXT_ORIGIN_UNKNOWN = 2;
}

// A second opinion, and what is known about the context that formed it.
//
// The retired zero_knowledge field was a bool constrained to true, which made
// an honest "we cannot tell" unrepresentable: every record asserted
// independence because the schema permitted nothing else.
message IndependentReview {
  reserved 3;
  reserved "zero_knowledge";

  string run_id = 1 [(buf.validate.field).string.min_len = 1];
  string reviewer_id = 2 [(buf.validate.field).string.min_len = 1];
  bytes target_fingerprint_sha256 = 4 [(buf.validate.field).bytes.len = 32];
  Verdict verdict = 5 [(buf.validate.field).required = true];
  bytes provider_attestation = 6;
  google.protobuf.Timestamp completed_at = 7 [(buf.validate.field).required = true];
  ContextOrigin context_origin = 8 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message MarginalYield {
  uint32 candidates_examined = 1;
  uint32 candidates_disproved = 2;
  uint32 new_p0_p1 = 3;
  uint32 new_p2_p3 = 4;
}

message FindingCounts {
  uint32 total = 1;
  uint32 verified = 2;
  uint32 accepted = 3;
  uint32 open_p0 = 4;
  uint32 open_p1 = 5;
}

message FindingSnapshot {
  string id = 1 [(buf.validate.field).string.pattern = "^FG-(COR|INT|SEC|REL|OPS|PER|VER|MNT|DEP|HUM)-[0-9a-f]{12}([0-9a-f]{4})?$"];
  FindingStatus status = 2 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Risk risk = 3 [(buf.validate.field).required = true];
  EvidenceTier evidence_tier = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  bytes evidence_sha256 = 5 [(buf.validate.field).bytes.len = 32];
  // What an independent attack on this claim came to. Every other field here
  // is the reporting context describing its own finding.
  FindingProvenance provenance = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
}

message LedgerRef {
  string path = 1 [(buf.validate.field).string.const = ".grimes/ledger.pb"];
  bytes digest_sha256 = 2 [(buf.validate.field).bytes.len = 32];
  bool oscillation_detected = 3;
}

message GrimesResult {
  option (buf.validate.message).cel = {
    id: "result.orchestrator_only"
    message: "only the orchestrator may emit the final result"
    expression: "this.producer_role == 3"
  };
  option (buf.validate.message).cel = {
    id: "result.report_has_no_verification"
    message: "report mode records verification as not applicable"
    expression: "this.mode != 1 || this.verification.status == 4"
  };
  // In report mode the completion state is a total function of the record, and
  // this is that function: the same stopping rule the engine applies in Go. Fix
  // mode has no stated rule yet, so it is left out rather than guessed at.
  option (buf.validate.message).cel = {
    id: "result.report_completion_is_derived"
    message: "the completion state must be the one the colour, iteration, bound, exhaustion, and new P0/P1 count imply"
    expression:
      "this.mode != 1 || this.completion_state == ("
      "this.legacy_color == 1 ? 2 : "
      "this.iteration >= this.max_iterations ? 4 : "
      "(this.iteration > 1 && this.marginal_yield.new_p0_p1 == 0u) ? ("
      "this.unmet_gates.exists(g, g == 'coverage' || g == 'refutation') ? 6 : 2"
      ") : 1)"
  };
  // The fix-mode counterpart of the rule above. Same stopping discipline, with
  // two differences the mode forces: a finished run is FIX_COMPLETE, and a run
  // whose gate did not pass has not finished anything, so it is BOUNDED rather
  // than complete.
  option (buf.validate.message).cel = {
    id: "result.fix_completion_is_derived"
    message: "the completion state must be the one the colour, iteration, bound, exhaustion, and gate imply"
    expression:
      "this.mode != 2 || this.completion_state == ("
      "this.legacy_color == 1 ? 3 : "
      "this.iteration >= this.max_iterations ? 4 : "
      "(this.iteration > 1 && this.marginal_yield.new_p0_p1 == 0u) ? ("
      "this.unmet_gates.exists(g, g == 'coverage' || g == 'refutation') ? 6 : "
      "(this.verification.status == 1 ? 3 : 6)"
      ") : 1)"
  };
  option (buf.validate.message).cel = {
    id: "result.commit_requires_a_passed_gate"
    message: "a batch may be committed only when the gate it ran passed"
    expression: "!has(this.fix_batch) || size(this.fix_batch.commit_sha1) == 0 || this.verification.status == 1"
  };
  option (buf.validate.message).cel = {
    id: "result.fix_batch_belongs_to_fix_mode"
    message: "only a fix-mode run records a fix batch"
    expression: "!has(this.fix_batch) || this.mode == 2"
  };
  option (buf.validate.message).cel = {
    id: "result.green_is_independent_and_verified"
    message: "GREEN requires an independent matching pass from a context the engine spawned, no oscillation, and required verification"
    expression:
      "this.legacy_color != 1 || "
      "(has(this.independent_review) && "
      "this.independent_review.verdict.decision == 3 && "
      "this.independent_review.context_origin == 1 && "
      "this.independent_review.target_fingerprint_sha256 == this.target.fingerprint_sha256 && "
      "!this.ledger.oscillation_detected && "
      "(this.mode == 1 || this.verification.status == 1))"
  };
  option (buf.validate.message).cel = {
    id: "result.green_requires_pass_tuple"
    message: "GREEN requires decision=pass, low residual risk, high confidence, sufficient completeness"
    expression:
      "this.legacy_color != 1 || "
      "(this.verdict.decision == 3 && this.verdict.residual_risk == 4 && "
      "this.verdict.review_confidence == 1 && this.verdict.review_completeness == 1)"
  };
  option (buf.validate.message).cel = {
    id: "result.red_matches_block"
    message: "RED and decision=block must agree"
    expression: "(this.legacy_color == 3) == (this.verdict.decision == 1)"
  };
  option (buf.validate.message).cel = {
    id: "result.unconfined_is_an_unmet_gate"
    message: "a run recorded as unconfined must report the confinement gate as unmet"
    expression: "this.confinement != 'unsafe' || this.unmet_gates.exists(g, g == 'confinement')"
  };
  option (buf.validate.message).cel = {
    id: "result.unconfined_caps_confidence"
    message: "a run recorded as unconfined must not claim high confidence"
    expression: "this.confinement != 'unsafe' || this.verdict.review_confidence != 1"
  };
  option (buf.validate.message).cel = {
    id: "result.open_p0_blocks"
    message: "an open P0 requires decision=block"
    expression: "this.counts.open_p0 == 0u || this.verdict.decision == 1"
  };

  uint32 schema_major = 1 [(buf.validate.field).uint32.const = 2];
  uint32 schema_minor = 2;
  string run_id = 3 [(buf.validate.field).string.min_len = 1];
  ProducerRole producer_role = 4 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Target target = 5 [(buf.validate.field).required = true];
  Mode mode = 6 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 iteration = 7 [(buf.validate.field).uint32.gt = 0];
  uint32 max_iterations = 8 [(buf.validate.field).uint32.gt = 0];
  CompletionState completion_state = 9 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  Verdict verdict = 10 [(buf.validate.field).required = true];
  LegacyColor legacy_color = 11 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  MarginalYield marginal_yield = 12 [(buf.validate.field).required = true];
  FindingCounts counts = 13 [(buf.validate.field).required = true];
  repeated FindingSnapshot findings = 14;
  Verification verification = 15 [(buf.validate.field).required = true];
  IndependentReview independent_review = 16;
  LedgerRef ledger = 17 [(buf.validate.field).required = true];
  repeated string unmet_gates = 18 [
    (buf.validate.field).repeated.unique = true,
    (buf.validate.field).repeated.items.string.min_len = 1
  ];
  string summary = 19 [(buf.validate.field).string.min_len = 1];
  RefuterCheck refuter_check = 20 [(buf.validate.field).enum.defined_only = true];
  // How each spawned role was bounded to the review's own artifacts. Named
  // rather than flagged, so a record says which mechanism was relied on and a
  // reader can tell a built-in boundary from an operator's wrapper.
  string confinement = 21 [(buf.validate.field).string.min_len = 1];
  // What a fix-mode run did with its edits. Absent in report mode, which edits
  // nothing.
  FixBatch fix_batch = 22;
}

// Where a fix-mode run put its edits, and what became of them.
//
// A batch is the whole iteration's work, not one fix: the gate runs once over
// all of it, so nothing smaller than the batch has a verification to point at.
message FixBatch {
  // A commit is the only outcome that needs no directory to point at, since the
  // edits are in history by then. Anything else has to say where the work is,
  // or the run has quietly thrown away what it did.
  option (buf.validate.message).cel = {
    id: "fix_batch.uncommitted_work_has_a_place"
    message: "a batch that produced no commit must name the directory holding its edits"
    expression: "size(this.commit_sha1) != 0 || this.worktree != ''"
  };
  // Findings a commit closes are the ones the gate passed over. Naming them
  // when there is no commit would claim a closure nothing verified.
  option (buf.validate.message).cel = {
    id: "fix_batch.closed_requires_commit"
    message: "only a committed batch closes findings"
    expression: "size(this.commit_sha1) != 0 || size(this.closed_finding_ids) == 0"
  };

  // Absolute: a worktree is outside the repository it was made from, so this is
  // not a RepoPath.
  string worktree = 1;
  string branch = 2;
  bytes commit_sha1 = 3 [
    (buf.validate.field).bytes.len = 20,
    (buf.validate.field).ignore = IGNORE_IF_ZERO_VALUE
  ];
  repeated string closed_finding_ids = 4 [(buf.validate.field).repeated = {
    items: {
      string: {min_len: 1}
    }
  }];
}

message LoopState {
  option (buf.validate.message).cel = {
    id: "state.iteration_within_limit"
    message: "iteration cannot exceed max_iterations"
    expression: "this.iteration <= this.max_iterations"
  };

  uint32 schema_major = 1 [(buf.validate.field).uint32.const = 2];
  uint32 schema_minor = 2;
  string run_id = 3 [(buf.validate.field).string.min_len = 1];
  Target target = 4 [(buf.validate.field).required = true];
  Mode mode = 5 [(buf.validate.field).enum = {
    defined_only: true
    not_in: [0]
  }];
  uint32 iteration = 6 [(buf.validate.field).uint32.gt = 0];
  uint32 max_iterations = 7 [(buf.validate.field).uint32.gt = 0];
  bytes ledger_digest_sha256 = 8 [(buf.validate.field).bytes.len = 32];
  bytes last_result_sha256 = 9 [(buf.validate.field).bytes.len = 32];
}
