name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  quality:
    name: Lint, format, and test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - run: just check

  build:
    name: Build release artifact
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      hashes: ${{ steps.hash.outputs.hashes }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: jdx/mise-action@v4.3.0
      - run: just build
      - name: Generate artifact hash
        id: hash
        run: |
          cd bin
          echo "hashes=$(sha256sum grimes-contract | base64 -w0)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: grimes-contract
          path: bin/grimes-contract
          if-no-files-found: error
          retention-days: 5

  provenance:
    name: Generate SLSA3 provenance
    needs: build
    permissions:
      actions: read # Needed for detection of GitHub Actions environment.
      id-token: write # Needed for provenance signing.
      contents: write # Needed for release uploads.
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_generic_slsa3.yml@v2.1.0
    with:
      base64-subjects: "${{ needs.build.outputs.hashes }}"

  release:
    name: Publish GitHub release
    needs: [build, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.1
        with:
          name: grimes-contract
          path: release
      - uses: actions/download-artifact@v8.0.1
        with:
          name: ${{ needs.provenance.outputs.provenance-name }}
          path: release
      - uses: softprops/action-gh-release@v3.0.2
        with:
          files: release/*
          generate_release_notes: true
